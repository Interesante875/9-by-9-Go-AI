# Pure PPO (no MCTS during self-play): games are sampled from the raw policy network and the
# network is trained with the clipped PPO objective + value loss on prioritised replay data.
# Much faster per game, but far weaker per hour than the MCTS-based "hybrid"/"alphazero" modes
# for Go. MCTS is still used when you play against the network in the GUI.
#   go9 train --config configs/ppo.ini --run_dir runs/ppo
algo = ppo
w_policy = 0
w_ppo = 1.0
w_entropy = 0.01
ppo_clip = 0.2
gae_lambda = 0.95
games_per_iter = 256
parallel_games = 256
selfplay_threads = 1
replay_capacity = 30000
sample_reuse = 3
min_replay = 4096
per_alpha = 0.4
