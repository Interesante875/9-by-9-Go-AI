# go9 preset for a desktop NVIDIA GPU (e.g. RTX 3060 .. 4090 / 50xx).
#   go9 train --config configs/gpu.ini --run_dir runs/main
# Keys not listed here keep their defaults (see configs/default.ini).
device = cuda
algo = hybrid

# Bigger network: ~3.0M parameters. Network size is fixed for a run (stored in the model file).
blocks = 10
channels = 128

# Self-play: many parallel games -> large GPU batches.
games_per_iter = 256
parallel_games = 128
selfplay_threads = 2
leaves_per_search = 2
full_sims = 400
fast_sims = 80
full_prob = 0.25
max_moves = 200

# Optimisation
batch_size = 512
lr = 0.001
lr_min = 0.00005
lr_decay_iters = 4000
sample_reuse = 4
min_replay = 20000
max_train_steps = 1000
replay_capacity = 500000

# Checkpoints / evaluation
save_every = 1
replay_save_every = 5
snapshot_every = 50
eval_every = 10
eval_games = 64
eval_sims = 200
