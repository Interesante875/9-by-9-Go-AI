# go9 preset for training on a CPU only (slow, but works anywhere).
#   go9 train --config configs/cpu.ini --run_dir runs/cpu
device = cpu
algo = hybrid
blocks = 6
channels = 64
games_per_iter = 32
parallel_games = 32
selfplay_threads = 2
full_sims = 96
fast_sims = 24
batch_size = 128
min_replay = 2000
replay_capacity = 100000
lr_decay_iters = 3000
eval_every = 10
eval_games = 20
eval_sims = 48
